[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "onestop-antibot"
version = "0.1.0"
description = "OneStop Antibot SDK: generate Akamai, SBSD, Pixel, DataDome, Cloudflare and Kasada payloads through the /generate API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "onestopantibot" }]
keywords = ["antibot", "akamai", "datadome", "cloudflare", "kasada", "sbsd", "onestop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typing-extensions>=4.1; python_version < '3.11'",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://github.com/Onestopapi/onestop-python-sdk"
Documentation = "https://onestopantibot.com/dashboard/docs"
Repository = "https://github.com/Onestopapi/onestop-python-sdk"
Changelog = "https://github.com/Onestopapi/onestop-python-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/Onestopapi/onestop-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/onestop_antibot"]

[tool.hatch.build.targets.sdist]
exclude = ["/examples", "/.github"]
